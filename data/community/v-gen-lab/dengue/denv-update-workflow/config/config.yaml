input_package: input/package
# Initial comparison baseline; fresh runs collect a new snapshot automatically.
data_use_snapshot: input/package/pathoplexus-metadata-2026-09-28.json
metadata_runs_dir: input/metadata-runs
# Versioned releases used as the source for every non-generated dataset file.
dataset_history_root: ../nextclade_data/data_output/community/v-gen-lab/dengue
# Reviewed for the 2026-09-15 input package using PR #478's 2026-09-24 review.
# Reassess on input updates; these are curated notices, not live terms lookups.
data_use_notices:
  denv1: config/data-use/pathoplexus-restricted.md
  denv2: config/data-use/pathoplexus-restricted.md
  denv3: config/data-use/pathoplexus.md
  denv4: config/data-use/pathoplexus.md
release_notes:
  - "2026 Annual update: added new lineages to the classification system as determined by the scientific committee."
  - "Updated representative tree sequences to reduce assignment errors."
  - "Outgroup sequences are now labeled `unassigned` instead of `Outgroup`."
  - "Restored country coloring and the map using Pathoplexus country metadata where available."
  - "Most reference-tree tips now use Pathoplexus accessions (`PP_...`) as their identifiers."
  - "Corrected placement masks to match each serotype's GFF3 coding bounds and reference length."
baseline_version: "2025"

builds:
  - denv1
  - denv2
  - denv3
  - denv4

resources:
  align_threads: 16
  tree_threads: 16

# Candidate mutation sets must cover this proportion of labelled descendants.
# A proposed lineage uses at most this many nucleotide mutations.
markers:
  min_support: 0.95
  min_markers: 2
  max_markers: 3
  max_outgroup_support: 0.01
